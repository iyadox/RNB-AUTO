# RNB AUTO avec Docker : base PostgreSQL + site.
#   1. Copiez .env.example en .env et remplissez au moins POSTGRES_PASSWORD, NEXT_PUBLIC_SITE_URL et SETUP_TOKEN.
#   2. docker compose up -d --build
#   3. Ouvrez /admin/installation (derrière HTTPS en production : voir docs/08-installation-et-deploiement.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rnb
      POSTGRES_USER: rnb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans le fichier .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnb -d rnb"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rnb:${POSTGRES_PASSWORD}@db:5432/rnb
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GEO_PROVIDER: ${GEO_PROVIDER:-auto}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
